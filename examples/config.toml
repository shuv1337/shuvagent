config_version = 1

[realtime]
provider = "openai"
model = "gpt-realtime-2"
api_key_env = "OPENAI_API_KEY"
voice = "marin"
reasoning_effort = "low"
session_max_duration_sec = 300
output_token_cap = 800
request_timeout_sec = 10.0

# Gemini Live via Pipecat is opt-in. Uncomment this block shape when testing
# Gemini credentials and model access:
#
# provider = "gemini"
# model = "models/gemini-3.1-flash-live-preview"
# api_key_env = "GOOGLE_API_KEY"
# voice = "Charon"

[audio]
capture_sample_rate = 24000
playback_sample_rate = 24000
capture_device = "default"
playback_device = "default"

[control]
socket = ""

[coordination]
shuvoice_status_poll_sec = 1.0
shuvoice_control_timeout_sec = 2.0

[ui]
show_overlay = false
overlay_position = "top-center"

[telemetry]
sink = "stdout"
file_path = ""
debug_log_raw_text = false

[privacy]
log_session_audio_duration = true
log_token_counts = true
