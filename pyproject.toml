[project]
name = "shuvagent"
version = "0.1.0"
description = "Desktop voice-agent app for Linux/Hyprland."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sounddevice>=0.5.3",
]

[project.scripts]
shuvagent = "shuvagent.cli:main"

[dependency-groups]
dev = [
    "hatchling>=1.28.0",
    "mypy>=1.18.2",
    "pytest>=9.0.1",
    "ruff>=0.14.6",
]

[build-system]
requires = ["hatchling>=1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shuvagent"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["shuvagent/tools"]
