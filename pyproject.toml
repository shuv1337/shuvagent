[project]
name = "shuvagent"
version = "0.1.0"
description = "Desktop voice-agent app for Linux/Hyprland."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[google]>=1.2.1",
    "sounddevice>=0.5.3",
    "websockets>=13.0",
]

[project.scripts]
shuvagent = "shuvagent.cli:main"

[dependency-groups]
dev = [
    "hatchling>=1.28.0",
    "mypy>=1.18.2",
    "pytest>=9.0.1",
    "ruff>=0.14.6",
]

[build-system]
requires = ["hatchling>=1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shuvagent"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "shuvagent/audio/runtime.py",
    "shuvagent/app.py",
    "shuvagent/cli.py",
    "shuvagent/control.py",
    "shuvagent/doctor.py",
    "shuvagent/live_qa.py",
    "shuvagent/realtime/openai_session.py",
    "shuvagent/realtime/pipecat_gemini_session.py",
    "shuvagent/realtime/providers.py",
    "shuvagent/tools",
    "shuvagent/selection.py",
    "shuvagent/usage.py",
    "shuvagent/window.py",
]

[tool.pytest.ini_options]
markers = [
    "integration: integration tests, including opt-in live external service smokes",
]
